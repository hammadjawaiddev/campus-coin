<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1020" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="description"
      content="Campus Coin — smart spending, student style. Track income, expenses, budgets and savings goals with insights built for college life."
    />
    <title>Campus Coin · Smart Spending, Student Style</title>

    <!-- Theme is applied before paint so there is never a light flash. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('campus-coin-ui');
          var prefs = stored ? JSON.parse(stored) : {};
          var theme = prefs.theme || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', dark);
          var size = prefs.fontSize || 'base';
          document.documentElement.style.fontSize = size === 'sm' ? '15px' : size === 'lg' ? '17.5px' : '16px';
          if (prefs.reducedMotion) document.documentElement.classList.add('reduce-motion');
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <style>
      /* Pre-hydration splash: inline so the first paint is on-brand, never white. */
      html { background: #0B1020; }
      html:not(.dark) { background: #F5F6FB; }
      #boot {
        position: fixed; inset: 0; display: grid; place-items: center;
        background: inherit; z-index: 9999;
      }
      #boot .mark {
        width: 54px; height: 54px; border-radius: 18px;
        background: linear-gradient(135deg, #6D5DFB, #22D3EE);
        box-shadow: 0 16px 45px -18px rgba(109, 93, 251, .8);
        animation: bootPulse 1.4s ease-in-out infinite;
      }
      @keyframes bootPulse { 0%, 100% { transform: scale(1); opacity: .95 } 50% { transform: scale(1.07); opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { #boot .mark { animation: none } }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div class="mark"></div></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
